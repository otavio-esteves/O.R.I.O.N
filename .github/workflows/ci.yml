name: F7 chat UI diagnostic
on:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case: [one, two]
    env:
      ORION_CHAT_AVD: orion-chat-diag-${{ github.run_id }}-${{ matrix.case }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: orion-chat-ui-apks
          github-token: ${{ github.token }}
          run-id: 44926222477
          path: ${{ runner.temp }}/orion-chat-apks
      - name: Enable KVM
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-orion-chat-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          avd-name: ${{ env.ORION_CHAT_AVD }}
          force-avd-creation: true
          emulator-boot-timeout: 300
          emulator-build: 15261927
          emulator-port: 5554
          cores: 2
          ram-size: 2048M
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none
          script: python3 scripts/android/orion-f7-chat-diagnostic.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --avd-name "$ORION_CHAT_AVD" --apk-dir "$RUNNER_TEMP/orion-chat-apks" --report-dir "$RUNNER_TEMP/orion-chat-ui"
