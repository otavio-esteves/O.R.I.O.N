name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMPOSE_PROJECT_NAME: orion-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check host ADB harness contract without a device
        run: docker compose run --rm host-harness-check
      - name: Build canonical Android environment
        run: env UID="$(id -u)" GID="$(id -g)" docker compose build android-build
      - name: Check and assemble application
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build check assembleDebug assembleRelease :app:assembleDebugAndroidTest :core:security:assembleDebugAndroidTest :ai:llama:assembleDebugAndroidTest :ai:service:assembleDebugAndroidTest :voice:service:assembleDebugAndroidTest --max-workers=2
      - name: Stage the canonical no-model chat APK pair
        run: |
          mkdir -p "$RUNNER_TEMP/orion-chat-apks"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/orion-chat-apks/"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/orion-chat-apks/"
          cd "$RUNNER_TEMP/orion-chat-apks"
          sha256sum app-debug.apk app-debug-androidTest.apk > SHA256SUMS
      - name: Retain chat APKs for host emulator execution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orion-chat-ui-apks
          path: ${{ runner.temp }}/orion-chat-apks/
          if-no-files-found: error
          retention-days: 3
      - name: Build the last integrated Room 11 APK pair with the same debug key
        env:
          ORION_UPGRADE_BASE: 398e46f3ce31c7541b94c01b797b0337bd9cbd18
        run: |
          baseline="$RUNNER_TEMP/orion-upgrade-source"
          git worktree add --detach "$baseline" "$ORION_UPGRADE_BASE"
          (
            cd "$baseline"
            env UID="$(id -u)" GID="$(id -g)" docker compose run --rm \
              -v "$GITHUB_WORKSPACE/.gradle:/workspace/.gradle" android-build \
              --project-cache-dir /tmp/orion-baseline-project-cache \
              :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2
          )
          mkdir -p "$RUNNER_TEMP/orion-upgrade-apks"
          cp "$baseline/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/orion-upgrade-apks/"
          cp "$baseline/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "$RUNNER_TEMP/orion-upgrade-apks/"
      - name: Retain baseline APKs for the installed upgrade
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orion-upgrade-apks
          path: ${{ runner.temp }}/orion-upgrade-apks/
          if-no-files-found: error
          retention-days: 3
      - name: Build scoped minified native qualification artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2
      - name: Build opt-in unloaded physical baseline artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true -PorionPhysicalBaseline=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2
      - name: Build opt-in read-only Cortex readiness artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true -PorionCortexReadinessProbe=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2
      - name: Build opt-in sanitized exit capture artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true -PorionExitEvidenceCapture=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2
      - name: Build opt-in Cortex generation metrics qualification artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true -PorionCortexGenerationMetrics=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2
      - name: Build opt-in existing-owner single-attempt qualification artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true -PorionCortexSingleAttempt=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2
      - name: Build opt-in bounded runtime capture qualification artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true -PorionCortexRuntimeCapture=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest :app:assembleDebug :app:assembleRelease --max-workers=2
      - name: Build opt-in finite instrumented workload qualification artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true -PorionCortexInstrumentedWorkload=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2
      - name: Build minified hybrid chat qualification artifacts without a model
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true -PorionHybridChatQualification=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2

  chat-ui-no-model:
    needs: android-build-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORION_CHAT_AVD: orion-chat-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the Docker-built APK pair
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orion-chat-ui-apks
          path: ${{ runner.temp }}/orion-chat-apks
      - name: Download the Docker-built baseline APK pair
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orion-upgrade-apks
          path: ${{ runner.temp }}/orion-upgrade-apks
      - name: Initialize an explicit not-run report
        run: |
          mkdir -p "$RUNNER_TEMP/orion-chat-ui"
          printf '%s\n' '{"environment":"ANDROID_EMULATOR","result":"NOT_RUN","reason":"EMULATOR_OR_RUNNER_NOT_STARTED","expected":9,"started":0,"passed":0,"failed":0,"skipped":0}' > "$RUNNER_TEMP/orion-chat-ui/summary.json"
      - name: Enable KVM on the disposable host runner
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-orion-chat-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute the chat and F8 Android suites on the host
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          avd-name: ${{ env.ORION_CHAT_AVD }}
          force-avd-creation: true
          emulator-boot-timeout: 300
          emulator-build: 15261927 # Emulator 36.5.11.0; matches the scoped local runtime
          emulator-port: 5554
          cores: 2
          ram-size: 2048M
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none
          script: |
            set -e
            python3 scripts/android/verify-chat-ui.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --avd-name "$ORION_CHAT_AVD" --apk-dir "$RUNNER_TEMP/orion-chat-apks" --report-dir "$RUNNER_TEMP/orion-chat-ui"
            python3 scripts/android/verify-chat-ui.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --avd-name "$ORION_CHAT_AVD" --apk-dir "$RUNNER_TEMP/orion-chat-apks" --report-dir "$RUNNER_TEMP/orion-f8" --suite f8
            python3 scripts/android/verify-chat-ui.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --avd-name "$ORION_CHAT_AVD" --apk-dir "$RUNNER_TEMP/orion-chat-apks" --report-dir "$RUNNER_TEMP/orion-f9" --suite f9
            python3 scripts/android/verify-installed-upgrade.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --environment ANDROID_EMULATOR --previous-apk "$RUNNER_TEMP/orion-upgrade-apks/app-debug.apk" --previous-test-apk "$RUNNER_TEMP/orion-upgrade-apks/app-debug-androidTest.apk" --apk-dir "$RUNNER_TEMP/orion-chat-apks" --evidence-dir "$RUNNER_TEMP/orion-f8-upgrade"
            python3 scripts/android/verify-transaction-process-death.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --environment ANDROID_EMULATOR --scenario sentinel_delivery --apk-dir "$RUNNER_TEMP/orion-chat-apks" --evidence-dir "$RUNNER_TEMP/orion-f8-death"
            python3 scripts/android/verify-voice-process-recovery.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --avd-name "$ORION_CHAT_AVD" --apk "$RUNNER_TEMP/orion-chat-apks/app-debug.apk" --report "$RUNNER_TEMP/orion-f9/voice-processes.json"
      - name: Remove only this job's AVD
        if: always()
        run: |
          if [ -f "$HOME/.android/avd/$ORION_CHAT_AVD.ini" ]; then
            timeout 30s "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" delete avd --name "$ORION_CHAT_AVD"
          fi
      - name: Retain sanitized counts and JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orion-chat-ui-report
          path: |
            ${{ runner.temp }}/orion-chat-ui/summary.json
            ${{ runner.temp }}/orion-chat-ui/junit.xml
            ${{ runner.temp }}/orion-f8/summary.json
            ${{ runner.temp }}/orion-f8/junit.xml
            ${{ runner.temp }}/orion-f8-upgrade/installed-upgrade-report.json
            ${{ runner.temp }}/orion-f8-death/*.json
            ${{ runner.temp }}/orion-f9/summary.json
            ${{ runner.temp }}/orion-f9/junit.xml
            ${{ runner.temp }}/orion-f9/voice-processes.json
          if-no-files-found: error
          retention-days: 7

  # Keep the existing required status-check name. A skipped/failed UI job cannot
  # leave that check green; no branch-protection change is needed.
  docker-build-and-check:
    if: always()
    needs: [android-build-and-check, chat-ui-no-model]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require canonical build and actual no-model UI success
        env:
          ORION_BUILD_RESULT: ${{ needs.android-build-and-check.result }}
          ORION_UI_RESULT: ${{ needs.chat-ui-no-model.result }}
        run: |
          test "$ORION_BUILD_RESULT" = success
          test "$ORION_UI_RESULT" = success
