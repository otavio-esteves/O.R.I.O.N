name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check host ADB harness contract without a device
        run: docker compose run --rm host-harness-check
      - name: Build canonical Android environment
        run: env UID="$(id -u)" GID="$(id -g)" docker compose build android-build
      - name: Check and assemble application
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build check assembleDebug assembleRelease :app:assembleDebugAndroidTest :core:security:assembleDebugAndroidTest --max-workers=2
      - name: Build scoped minified native qualification artifacts
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm android-build -PorionQualificationRelease=true :app:verifyQualificationNativePackage :app:assembleQualificationReleaseAndroidTest --max-workers=2
