services:
  host-harness-check:
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    profiles: [validation]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:exec
    command: [python3, -m, unittest, discover, -s, scripts/android, -p, "test_*_harness.py"]

  android-build:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - orion-android-user:/tmp/.android
    environment:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_USER_HOME: /tmp/.android
      ANDROID_SDK_ROOT: /opt/android-sdk
      HOME: /tmp
      JAVA_TOOL_OPTIONS: -Duser.home=/tmp

volumes:
  orion-android-user:
