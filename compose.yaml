services:
  android-build:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_USER_HOME: /tmp/.android
      ANDROID_SDK_ROOT: /opt/android-sdk
      HOME: /tmp
      JAVA_TOOL_OPTIONS: -Duser.home=/tmp
